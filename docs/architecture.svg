<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Daily architecture: how one brief is made</title>
  <desc id="desc">A four-stage pipeline orchestrated by Trigger.dev. Claude Haiku resolves free-text interests into search queries, Perplexity retrieves the news one query per topic, Claude Opus synthesises the sectioned brief, and Claude Sonnet plus OpenAI text-to-speech produce the podcast. Supabase stores preferences, reports and audio.</desc>

  <style>
    .t   { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .h1  { font-size: 23px; font-weight: 700; fill: #1c1a17; letter-spacing: -0.2px; }
    .sub { font-size: 13.5px; fill: #6f6a61; }
    .band{ font-size: 13px; font-weight: 600; fill: #1c1a17; }
    .bandsm { font-size: 11.5px; fill: #6f6a61; }
    .kicker { font-size: 10.5px; font-weight: 700; fill: #c0512b; letter-spacing: 1.3px; }
    .stage { font-size: 14.5px; font-weight: 700; fill: #1c1a17; }
    .prov  { font-size: 11.5px; font-weight: 600; fill: #c0512b; }
    .body  { font-size: 11.5px; fill: #6f6a61; }
    .foot  { font-size: 11.5px; fill: #8a8579; }
  </style>

  <rect x="0" y="0" width="1040" height="600" rx="18" fill="#faf8f4"/>
  <rect x="0.5" y="0.5" width="1039" height="599" rx="18" fill="none" stroke="#ece6db"/>

  <text class="t h1" x="40" y="50">Daily — how one brief is made</text>
  <text class="t sub" x="40" y="74">A multi-stage pipeline: retrieval, synthesis, and audio generation.</text>

  <!-- INPUT -->
  <rect x="40" y="98" width="960" height="52" rx="12" fill="#ffffff" stroke="#ece6db"/>
  <text class="t kicker" x="60" y="121">WHAT THE READER CHOOSES</text>
  <text class="t bandsm" x="60" y="139">Genres, subtopics, and interests written in plain English — “what China is doing in chip development”</text>
  <text class="t body" x="980" y="130" text-anchor="end">React PWA · Vercel</text>

  <path d="M520 150 L520 172" stroke="#c0512b" stroke-width="1.6"/>
  <path d="M514 166 L520 173 L526 166" fill="none" stroke="#c0512b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ORCHESTRATION -->
  <rect x="40" y="178" width="960" height="50" rx="12" fill="#ffffff" stroke="#c0512b" stroke-opacity="0.35"/>
  <text class="t kicker" x="60" y="200">ORCHESTRATION · TRIGGER.DEV</text>
  <text class="t bandsm" x="60" y="218">Runs on a weekday schedule or on demand. Every stage is idempotent and retried independently.</text>

  <!-- STAGES -->
  <g>
    <rect x="40" y="252" width="225" height="166" rx="12" fill="#ffffff" stroke="#ece6db"/>
    <text class="t kicker" x="60" y="278">STAGE 1</text>
    <text class="t stage" x="60" y="300">Resolve</text>
    <text class="t prov" x="60" y="320">Claude Haiku</text>
    <text class="t body" x="60" y="344">Turns each free-text interest</text>
    <text class="t body" x="60" y="360">into a clean search query,</text>
    <text class="t body" x="60" y="376">re-read on every run so it</text>
    <text class="t body" x="60" y="392">stays topical.</text>
  </g>

  <g>
    <rect x="285" y="252" width="225" height="166" rx="12" fill="#ffffff" stroke="#ece6db"/>
    <text class="t kicker" x="305" y="278">STAGE 2</text>
    <text class="t stage" x="305" y="300">Retrieve</text>
    <text class="t prov" x="305" y="320">Perplexity sonar-pro</text>
    <text class="t body" x="305" y="344">One search per topic, not one</text>
    <text class="t body" x="305" y="360">composite. Results are cached</text>
    <text class="t body" x="305" y="376">per topic per day and shared</text>
    <text class="t body" x="305" y="392">across every reader.</text>
  </g>

  <g>
    <rect x="530" y="252" width="225" height="166" rx="12" fill="#ffffff" stroke="#ece6db"/>
    <text class="t kicker" x="550" y="278">STAGE 3</text>
    <text class="t stage" x="550" y="300">Synthesise</text>
    <text class="t prov" x="550" y="320">Claude Opus</text>
    <text class="t body" x="550" y="344">One sectioned brief. A newly</text>
    <text class="t body" x="550" y="360">followed topic gets a catch-up</text>
    <text class="t body" x="550" y="376">primer; days missed get a</text>
    <text class="t body" x="550" y="392">“while you were away” recap.</text>
  </g>

  <g>
    <rect x="775" y="252" width="225" height="166" rx="12" fill="#ffffff" stroke="#ece6db"/>
    <text class="t kicker" x="795" y="278">STAGE 4 · ON REQUEST</text>
    <text class="t stage" x="795" y="300">Narrate</text>
    <text class="t prov" x="795" y="320">Claude Sonnet · OpenAI TTS</text>
    <text class="t body" x="795" y="344">The brief is rewritten as a</text>
    <text class="t body" x="795" y="360">two-voice interview, spoken in</text>
    <text class="t body" x="795" y="376">parallel, then assembled with</text>
    <text class="t body" x="795" y="392">ffmpeg into one episode.</text>
  </g>

  <path d="M266 329 L283 329" stroke="#c0512b" stroke-width="1.6"/>
  <path d="M277 323 L284 330 L277 337" fill="none" stroke="#c0512b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M511 329 L528 329" stroke="#c0512b" stroke-width="1.6"/>
  <path d="M522 323 L529 330 L522 337" fill="none" stroke="#c0512b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M756 329 L773 329" stroke="#c0512b" stroke-width="1.6"/>
  <path d="M767 323 L774 330 L767 337" fill="none" stroke="#c0512b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M520 418 L520 442" stroke="#c0512b" stroke-width="1.6"/>
  <path d="M514 436 L520 443 L526 436" fill="none" stroke="#c0512b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- STORAGE -->
  <rect x="40" y="448" width="960" height="52" rx="12" fill="#ffffff" stroke="#ece6db"/>
  <text class="t kicker" x="60" y="471">STORAGE · SUPABASE</text>
  <text class="t bandsm" x="60" y="489">Postgres with row-level security on every table, auth, and a private bucket for episode audio.</text>
  <text class="t body" x="980" y="480" text-anchor="end">service role writes · anon key reads</text>

  <path d="M520 500 L520 522" stroke="#c0512b" stroke-width="1.6"/>
  <path d="M514 516 L520 523 L526 516" fill="none" stroke="#c0512b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- OUTPUT -->
  <rect x="40" y="528" width="960" height="44" rx="12" fill="#c0512b" fill-opacity="0.08" stroke="#c0512b" stroke-opacity="0.35"/>
  <text class="t band" x="60" y="556">Back in the app: a reader-style brief, and a podcast episode with per-topic chapters.</text>
  <text class="t foot" x="980" y="556" text-anchor="end">mobile-first PWA</text>
</svg>
